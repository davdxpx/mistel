[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mncf"
version = "1.0.0"
description = "Reads, writes and converts files of the Mistel Native Cheat Format (.mncf), version 1"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["mncf"]
