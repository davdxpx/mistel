about = "Back to Atmosphère for a build the file does not name, from the patterns, with that build's module: the cheats with offsets only for another build are left out with build-unknown."
to = "atmosphere"
mncf = "convert-module.mncf"
build = "1.0.1"
module_build_id = "1122334455667788"

[module]                     # the main module of the build
size = 0x3800
code = [0x0, 0x2000]
rodata = [0x2000, 0x3000]
data = [0x3000, 0x3800]
text_size = 0x1FE0
bytes = [
  { at = 0x1040, hex = "FD 7B BF A9 FD 03 00 91 68 12 00 B9 40 00 00 94 08 00 00 90 00 21 40 B9 FD 7B C1 A8 C0 03 5F D6" },
  { at = 0x1840, hex = "00 10 2E 1E 08 20 20 1E" },
  { at = 0x2100, hex = "45 78 61 6D 70 6C 65 00" },
  { at = 0x3020, hex = "00 01 00 10 00 00 00 00" },
]

[expect]
name = "1122334455667788.txt"
file = "back-new-build.txt"
written = { money = "core", "hold-a" = "core", speed = "core" }
reasons = { "master-setup" = "build-unknown", "branch-away" = "build-unknown", "data-flag" = "build-unknown", "heap-value" = "build-unknown", pointer = "build-unknown", condition = "build-unknown", "cave-jump" = "build-unknown", loop = "build-unknown" }
