about = "Atmosphère's limits: the code of both master cheats in one master entry, a group in EdiZon section markers, which take no slot, at most 127 other entries with code (atmosphere:too-many) of at most 256 words (atmosphere:too-long); a pointer path whose base lies past the module (outside); and one cheat written from its core operations, with the player's value, while the others use their raw entries."
to = "atmosphere"
build = "1.0.0"
prefer_cheats = { tickets = "core" }
values = { "tickets.count" = 7 }
text = '''
format = "mncf/1"
name = "Back limits"
extensions = { optional = ["raw/1", "arm64-imm/1"] }

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.0"]
modules = { main = "0123456789ABCDEF" }

[[cheat]]
id = "setup-a"
name = "Setup A"
master = true

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = 1

[[cheat]]
id = "setup-b"
name = "Setup B"
master = true

  [[cheat.write]]
  at = { region = "heap", offset = 0x4 }
  type = "u32"
  value = 2

[[cheat]]
id = "in-group"
name = "In group"
group = "Group"

  [[cheat.write]]
  at = { region = "heap", offset = 0x8 }
  type = "u32"
  value = 3

[[cheat]]
id = "after-group"
name = "After group"

  [[cheat.write]]
  at = { region = "heap", offset = 0xC }
  type = "u32"
  value = 4

[[cheat]]
id = "tickets"
name = "Tickets"

  [cheat.values.count]
  type = "u16"
  default = 5

  [[cheat.patch]]
  at = { module = "main", offset = 0x1008 }
  expect = "68 12 00 B9"
  encode = { insn = "movz", width = 32, rd = 8, value = "$count" }

  [[cheat.raw]]
  syntax = "atmosphere"
  build = "1.0.0"
  code = """
04000000 00001008 528000A8
"""

[[cheat]]
id = "far-pointer"
name = "Far pointer"

  [[cheat.write]]
  at = { module = "main", offset = 0x37FC, path = [0x10] }
  type = "u32"
  value = 1

[[cheat]]
id = "long"
name = "Long"

  [[cheat.write]]
  at = { region = "heap", offset = 0x100 }
  type = "bytes"
  value = "11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11 11"

