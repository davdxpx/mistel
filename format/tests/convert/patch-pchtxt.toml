about = "An IPSwitch file: each patch a cheat named by its comment and on where it is @enabled, in a group of the patch set; offset_shift, a string, @little-endian, credits, forced comments and lines that are no patch."
from = "patches"
game = "0100000000ABC000"
game_name = "Example Quest"

[[source]]
file_name = "example.pchtxt"
set = "Example pack"
version = "1.0.0"
text = '''
@nsobid-0123456789ABCDEF0000000000000000000000000000000000000000
# Made for 1.0.0
// Patches by Ann (example forum)
@flag offset_shift 0x100

// Store more
@enabled
00001008 691200B9 // str w9, [x19, #0x10]

// Mistel title
@disabled
00002100 "Mistel\0"

// Little end
@little-endian
@enabled
00001010 B9402100
@big-endian
this line is no patch

@stop
// Ignored
@enabled
00001008 00000000
'''

  [source.module]
  size = 0x3800
  code = [0x0, 0x2000]
  rodata = [0x2000, 0x3000]
  data = [0x3000, 0x3800]
  text_size = 0x1FE0
  bytes = [
    { at = 0x1000, hex = "FD 7B BF A9 FD 03 00 91 68 12 00 B9 40 00 00 94 08 00 00 90 00 21 40 B9 FD 7B C1 A8 C0 03 5F D6" },
    { at = 0x1800, hex = "00 10 2E 1E 08 20 20 1E" },
    { at = 0x2100, hex = "45 78 61 6D 70 6C 65 00" },
    { at = 0x3020, hex = "00 01 00 10 00 00 00 00" },
  ]

[expect]
file = "patch-pchtxt.mncf"
