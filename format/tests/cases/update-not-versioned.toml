about = """With [update] or change entries, file_version must be a version. Where it is not, both are left out \
with a warning, and the file is used."""
text = '''
format = "mncf/1"
name = "Not versioned"
id = "example.org/someone/not-versioned"
file_version = "v3"

[update]
url = "https://example.org/someone/not-versioned.mncf"

[[changes]]
version = "3"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "money"
name = "Money"

  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 5
'''

[env.regions.heap]
base = 0x10000000
size = 0x1000

[expect]
warnings = ["update", "changes"]

[expect.cheat.money]
state = "off"
reason = ""
