about = "A key outside a cheat that neither the core nor an extension defines is a warning; a broken preset is dropped with a warning."
text = '''
format = "mncf/1"
name = "Conformance"
colour = "red"

[game]
platform = "switch"
id = "0100000000ABC000"
region = "eu"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[preset]]
id = "relaxed"
name = "Relaxed"
cheats = ["plain", "ghost"]

[[preset]]
id = "fine"
name = "Fine"
cheats = ["plain"]
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""
warnings = ["unknown-key:colour", "unknown-key:game.region", "preset:relaxed"]

[expect.cheat.plain]
state = "off"
reason = ""
uses = "core"
