about = "A cheat that is on but works only while buttons are held waits for them."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "hold"
name = "hold"
default = true
hold = "ZL"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "hold-two"
name = "hold-two"
default = true
hold = "ZL+R"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "toggle"
name = "toggle"
default = true
toggle = "L+DUP"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "hold-off"
name = "hold-off"
hold = "ZL"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.hold]
state = "waiting"
reason = ""
uses = "core"

[expect.cheat.hold-two]
state = "waiting"
reason = ""
uses = "core"

[expect.cheat.toggle]
state = "on"
reason = ""
uses = "core"

[expect.cheat.hold-off]
state = "off"
reason = ""
uses = "core"
