about = "With an optional extension the reader lacks, a key it does not know turns its cheat off with extension-missing."
text = '''
format = "mncf/1"
name = "Conformance"
extensions = { optional = ["x-glow/1"] }

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "glowing"
name = "glowing"
glow = true
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.glowing]
state = "refused"
reason = "extension-missing:x-glow/1"

[expect.cheat.plain]
state = "off"
reason = ""
uses = "core"
