about = "Pointer paths: each offset but the last is followed by a read; a null pointer or an address outside guest memory makes the cheat wait."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "two-steps"
name = "two-steps"
default = true
  [[cheat.write]]
  at = { module = "main", offset = 0x2000, path = [0x18, 0x8] }
  type = "u16"
  value = 99

[[cheat]]
id = "negative"
name = "negative"
  [[cheat.write]]
  at = { module = "main", offset = 0x2000, path = [-16] }
  type = "u32"
  value = 1

[[cheat]]
id = "from-region"
name = "from-region"
  [[cheat.write]]
  at = { region = "heap", offset = 0x100, path = [0x8] }
  type = "u8"
  value = 1

[[cheat]]
id = "null"
name = "null"
default = true
  [[cheat.write]]
  at = { module = "main", offset = 0x2008, path = [0x10] }
  type = "u32"
  value = 1

[[cheat]]
id = "null-off"
name = "null-off"
  [[cheat.write]]
  at = { module = "main", offset = 0x2008, path = [0x10] }
  type = "u32"
  value = 1

[[cheat]]
id = "outside"
name = "outside"
default = true
  [[cheat.write]]
  at = { module = "main", offset = 0x2010, path = [0x0] }
  type = "u32"
  value = 1
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [
  { at = 0x2000, hex = "00 01 00 10 00 00 00 00" },
  { at = 0x2010, hex = "00 00 00 00 70 00 00 00" },
]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[[env.memory]]
at = 0x10000100
hex = "00 03 00 10 00 00 00 00"

[[env.memory]]
at = 0x10000118
hex = "00 02 00 10 00 00 00 00"

[expect]
build = "1.0.2"

[expect.cheat.two-steps]
state = "on"
reason = ""
uses = "core"
ops = [
  { kind = "write", address = 0x10000208, bytes = "63 00" },
]

[expect.cheat.negative]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", address = 0x100000F0 },
]

[expect.cheat.from-region]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", address = 0x10000308 },
]

[expect.cheat.null]
state = "waiting"
reason = "path-broken"
uses = "core"

[expect.cheat.null-off]
state = "off"
reason = ""
uses = "core"

[expect.cheat.outside]
state = "waiting"
reason = "path-broken"
uses = "core"
