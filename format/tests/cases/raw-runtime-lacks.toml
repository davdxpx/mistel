about = "A runtime without raw/1 uses the core operations and refuses cheats that have none."
text = '''
format = "mncf/1"
name = "Conformance"
extensions = { optional = ["raw/1"] }

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "raw-only"
name = "raw-only"
  [[cheat.raw]]
  syntax = "atmosphere"
  build = "1.0.2"
  code = """
04000000 00000100 B9001269
"""

[[cheat]]
id = "raw-and-core"
name = "raw-and-core"
  [[cheat.patch]]
  at = { module = "main", offset = 0x100 }
  expect = "68 12 00 B9"
  bytes = "69 12 00 B9"
  [[cheat.raw]]
  syntax = "atmosphere"
  build = "1.0.2"
  code = """
04000000 00000100 B9001269
"""
'''

[env]
platform = "switch"
extensions = ["arm64-imm/1"]

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [
  { at = 0x100, hex = "68 12 00 B9 11 22 33 94" },
]

[expect]
build = "1.0.2"

[expect.cheat.raw-only]
state = "refused"
reason = "extension-missing:raw/1"

[expect.cheat.raw-and-core]
state = "off"
reason = ""
uses = "core"
