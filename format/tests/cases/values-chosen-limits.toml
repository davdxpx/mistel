about = "A chosen value outside the value's range or choices, or of another type, refuses the cheat."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[choices.items]
"1" = "Potion"
"2" = "Ether"

[[cheat]]
id = "above-max"
name = "above-max"
  [cheat.values.n]
  type = "u8"
  max = 10
  default = 5

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = "$n"

[[cheat]]
id = "not-a-choice"
name = "not-a-choice"
  [cheat.values.item]
  type = "u8"
  choices = "items"
  default = 1

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = "$item"

[[cheat]]
id = "float-for-int"
name = "float-for-int"
  [cheat.values.n]
  type = "u8"
  default = 1

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = "$n"

[[cheat]]
id = "fine"
name = "fine"
  [cheat.values.n]
  type = "u8"
  max = 10
  default = 5

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = "$n"
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[env.values]
"above-max.n" = 11
"not-a-choice.item" = 3
"float-for-int.n" = 1.5
"fine.n" = 10

[expect]
build = ""

[expect.cheat.above-max]
state = "refused"
reason = "value-out-of-range"

[expect.cheat.not-a-choice]
state = "refused"
reason = "value-out-of-range"

[expect.cheat.float-for-int]
state = "refused"
reason = "value-out-of-range"

[expect.cheat.fine]
state = "off"
reason = ""
ops = [ { kind = "write", bytes = "0A" } ]
