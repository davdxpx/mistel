about = "Pointer paths and conditions read guest memory."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "path"
name = "path"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0, path = [0x8] }
  type = "u32"
  value = 1

[[cheat]]
id = "condition"
name = "condition"
  [[cheat.when]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  op = "changed"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"
capabilities = ["guest-write", "code-bytes"]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.path]
state = "refused"
reason = "capability-missing:guest-read"

[expect.cheat.condition]
state = "refused"
reason = "capability-missing:guest-read"

[expect.cheat.plain]
state = "off"
reason = ""
uses = "core"
