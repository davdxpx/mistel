about = "A Switch build ID matches when the shorter hexadecimal string is a prefix of the longer one, in any case."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "per-build"
name = "per-build"
  [[cheat.write]]
  at = { region = "heap", offsets = { "1.0.2" = 0x10, "1.0.3" = 0x20 } }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.modules.main]
id = "a1b2c3d4e5f60718000102030405060708090a0b0c0d0e0f1011121314151617"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [
  { at = 0x100, hex = "68 12 00 B9 11 22 33 94" },
]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = "1.0.2"

[expect.cheat.per-build]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", address = 0x10000010 },
]
