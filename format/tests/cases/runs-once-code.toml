about = """A cheat that runs once does its writes in one pass and is off right after it, so a patch or an override, \
which work only while a cheat is on, make it invalid at `run` (section 7.2)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "once-write"
name = "once-write"
run = "once"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "once-patch"
name = "once-patch"
run = "once"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
  [[cheat.patch]]
  at = { module = "main", offset = 0x100 }
  expect = "68 12 00 B9"
  bytes = "69 12 00 B9"

[[cheat]]
id = "once-override"
name = "once-override"
run = "once"
  [[cheat.override]]
  function = { module = "main", offset = 0x100 }
  action = "skip"
  expect = "68 12 00 B9"

[[cheat]]
id = "timed-patch"
name = "timed-patch"
run = "timed"
duration = 10
  [[cheat.patch]]
  at = { module = "main", offset = 0x100 }
  expect = "68 12 00 B9"
  bytes = "69 12 00 B9"
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [ { at = 0x100, hex = "68 12 00 B9" } ]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect.cheat.once-write]
state = "off"
reason = ""
uses = "core"

[expect.cheat.once-patch]
state = "refused"
reason = "invalid:run"

[expect.cheat.once-override]
state = "refused"
reason = "invalid:run"

[expect.cheat.timed-patch]
state = "off"
reason = ""
uses = "core"
