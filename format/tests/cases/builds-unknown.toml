about = "When no build matches, per-build offsets and raw entries do not resolve; patterns still work."
text = '''
format = "mncf/1"
name = "Conformance"
extensions = { optional = ["raw/1"] }

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "per-build"
name = "per-build"
  [[cheat.write]]
  at = { region = "heap", offsets = { "1.0.2" = 0x10, "1.0.3" = 0x20 } }
  type = "u8"
  value = 1

[[cheat]]
id = "pattern"
name = "pattern"
  [[cheat.patch]]
  at = { module = "main", find = "68 12 00 B9 ?? ?? ?? 94" }
  expect = "68 12 00 B9"
  bytes = "69 12 00 B9"

[[cheat]]
id = "raw-only"
name = "raw-only"
  [[cheat.raw]]
  syntax = "atmosphere"
  build = "1.0.2"
  code = "04000000 00100000 00000001"
'''

[env]
platform = "switch"

[env.modules.main]
id = "FFFFFFFFFFFFFFFF"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [
  { at = 0x100, hex = "68 12 00 B9 11 22 33 94" },
]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.per-build]
state = "refused"
reason = "build-unknown"

[expect.cheat.pattern]
state = "off"
reason = ""
uses = "core"

[expect.cheat.raw-only]
state = "refused"
reason = "build-unknown"
