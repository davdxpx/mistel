about = """What is wrong with the keys of section 17 is left out with a warning, and the file is used: an id that \
is not one (which also drops [update]), and change entries that break a rule, each named by its version or position. An entry for a version that \
an earlier entry has already is left out too."""
text = '''
format = "mncf/1"
name = "Update warnings"
id = "Example.org/Someone"
file_version = "4"

[update]
url = "https://example.org/someone/update-warnings.mncf"
mirror = "https://example.net/x.mncf"

[[changes]]
version = "4"
date = "2026-02-30"

[[changes]]
version = "5"

[[changes]]
version = "3"
added = ["a"]
fixed = ["a"]

[[changes]]
version = "1.5"
renamed = { a = "c", b = "c" }

[[changes]]
version = "2"

[[changes]]
version = "2.0"

[[changes]]
version = "1"
removed = ["a"]
renamed = { a = "b" }
note = "kept"

[[changes]]
version = 1

[[changes]]
version = "0.9"
added = ["Not-an-id"]

[[changes]]
version = "0.8"
text = 8

[[changes]]
version = "0.7"
added = ["x", "x"]

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "money"
name = "Money"

  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 5
'''

[env.regions.heap]
base = 0x10000000
size = 0x1000

[expect]
warnings = ["id", "update", "unknown-key:update.mirror", "changes:4", "changes:5", "changes:3", "changes:1.5", "changes:2.0", "changes:1", "unknown-key:changes.note", "changes:8", "changes:0.9", "changes:0.8", "changes:0.7"]

[expect.cheat.money]
state = "off"
reason = ""
