about = """An [update] whose address section 17.3 does not allow is left out, and so is a changes key that is \
not an array of tables."""
text = '''
format = "mncf/1"
name = "Bad forms"
id = "example.org/someone/bad-forms"
file_version = "3"
changes = "none"

[update]
url = "http://example.org/someone/bad-forms.mncf"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "money"
name = "Money"

  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 5
'''

[env.regions.heap]
base = 0x10000000
size = 0x1000

[expect]
