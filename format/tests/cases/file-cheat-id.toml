about = "A cheat id is lower-case letters, digits and `-`, starting with a letter."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "Money"
name = "Money"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[expect]
error = "schema:cheat.id"
