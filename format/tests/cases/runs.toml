about = "The rules of `run`, `press`, `duration`, monitors and the other keys of a cheat."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "action"
name = "action"
run = "action"
press = "ZL+R"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "action-no-press"
name = "action-no-press"
run = "action"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "press-no-action"
name = "press-no-action"
press = "ZL"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "timed"
name = "timed"
run = "timed"
duration = 30
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "timed-no-duration"
name = "timed-no-duration"
run = "timed"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "duration-not-timed"
name = "duration-not-timed"
duration = 30
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "monitor"
name = "monitor"
run = "monitor"
  [[cheat.read]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  label = "HP"

[[cheat]]
id = "monitor-writes"
name = "monitor-writes"
run = "monitor"
  [[cheat.read]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "read-no-monitor"
name = "read-no-monitor"
  [[cheat.read]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"

[[cheat]]
id = "bad-run"
name = "bad-run"
run = "forever"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "bad-button"
name = "bad-button"
hold = "ZL+Q"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "twice-button"
name = "twice-button"
hold = "ZL+ZL"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "stick"
name = "stick"
hold = "LSTICK_UP"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "no-operation"
name = "no-operation"

[[cheat]]
id = "only-when"
name = "only-when"
  [[cheat.when]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  op = "changed"

[[cheat]]
id = "bad-group"
name = "bad-group"
group = "Items//Potions"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "bad-tags"
name = "bad-tags"
tags = "cosmetic"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "bad-default"
name = "bad-default"
default = "yes"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "no-name"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.action]
state = "off"
reason = ""
uses = "core"

[expect.cheat.action-no-press]
state = "refused"
reason = "invalid:press"

[expect.cheat.press-no-action]
state = "refused"
reason = "invalid:press"

[expect.cheat.timed]
state = "off"
reason = ""
uses = "core"

[expect.cheat.timed-no-duration]
state = "refused"
reason = "invalid:duration"

[expect.cheat.duration-not-timed]
state = "refused"
reason = "invalid:duration"

[expect.cheat.monitor]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "read", address = 0x10000010, type = "u16", label = "HP" },
]

[expect.cheat.monitor-writes]
state = "refused"
reason = "invalid:run"

[expect.cheat.read-no-monitor]
state = "refused"
reason = "invalid:read"

[expect.cheat.bad-run]
state = "refused"
reason = "invalid:run"

[expect.cheat.bad-button]
state = "refused"
reason = "invalid:hold"

[expect.cheat.twice-button]
state = "refused"
reason = "invalid:hold"

[expect.cheat.stick]
state = "off"
reason = ""
uses = "core"

[expect.cheat.no-operation]
state = "refused"
reason = "invalid"

[expect.cheat.only-when]
state = "refused"
reason = "invalid"

[expect.cheat.bad-group]
state = "refused"
reason = "invalid:group"

[expect.cheat.bad-tags]
state = "refused"
reason = "invalid:tags"

[expect.cheat.bad-default]
state = "refused"
reason = "invalid:default"

[expect.cheat.no-name]
state = "refused"
reason = "invalid:name"
