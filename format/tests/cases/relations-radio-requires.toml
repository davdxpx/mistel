about = "A cheat in a radio group that others require stays on for all of them."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "a"
name = "a"
radio = "speed"

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "c"
name = "c"
default = true
requires = ["a"]

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "b"
name = "b"
default = true
requires = ["a"]

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.a]
state = "on"
reason = ""

[expect.cheat.c]
state = "on"
reason = ""

[expect.cheat.b]
state = "on"
reason = ""
