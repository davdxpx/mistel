about = """A file with the keys of section 17 loads without warnings, and its cheats work as in any file: the keys \
say nothing about what the cheats do."""
text = '''
format = "mncf/1"
name = "Update keys"
id = "example.org/someone/update-keys"
file_version = "2.1"

[update]
url = "https://example.org/someone/update-keys.mncf"

[[changes]]
version = "2.1"
date = "2026-12-02"
text = "Fits 1.0.3."
added = ["money"]
renamed = { coins = "money" }

[[changes]]
version = "2"
removed = ["speed"]

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "money"
name = "Money"
default = true

  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 5

[i18n.de.changes."2.1"]
text = "Passt zu 1.0.3."
'''

[env.regions.heap]
base = 0x10000000
size = 0x1000

[expect]
warnings = []

[expect.cheat.money]
state = "on"
reason = ""
uses = "core"
ops = [ { kind = "write", address = 0x10000010, bytes = "05" } ]
