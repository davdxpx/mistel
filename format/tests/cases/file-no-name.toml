about = "The file needs a `name`."
text = '''
format = "mncf/1"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[expect]
error = "schema:name"
