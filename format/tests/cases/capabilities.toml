about = "A cheat that needs a capability the runtime lacks is refused; the first missing one in the order of section 11.1 is named."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "patch"
name = "patch"
  [[cheat.patch]]
  at = { module = "main", offset = 0x100 }
  expect = "68 12 00 B9"
  bytes = "69 12 00 B9"

[[cheat]]
id = "hold"
name = "hold"
hold = "ZL"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "monitor"
name = "monitor"
run = "monitor"
  [[cheat.read]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"

[[cheat]]
id = "override"
name = "override"
  [[cheat.override]]
  function = { module = "main", offset = 0x100 }
  action = "skip"
  expect = "68 12 00 B9"

[[cheat]]
id = "patch-and-hold"
name = "patch-and-hold"
hold = "ZL"
  [[cheat.patch]]
  at = { module = "main", offset = 0x100 }
  expect = "68 12 00 B9"
  bytes = "69 12 00 B9"

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"
capabilities = ["guest-read", "guest-write"]

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [
  { at = 0x100, hex = "68 12 00 B9 11 22 33 94" },
]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = "1.0.2"

[expect.cheat.patch]
state = "refused"
reason = "capability-missing:code-bytes"

[expect.cheat.hold]
state = "refused"
reason = "capability-missing:buttons"

[expect.cheat.monitor]
state = "refused"
reason = "capability-missing:display"

[expect.cheat.override]
state = "refused"
reason = "capability-missing:code-hook"

[expect.cheat.patch-and-hold]
state = "refused"
reason = "capability-missing:code-bytes"

[expect.cheat.plain]
state = "off"
reason = ""
uses = "core"
