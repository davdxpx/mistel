about = "A duration, a step or a limit that is not a number refuses the cheat."
text = '''
format = "mncf/1"
name = "Conformance"
extensions = { optional = ["arm64-imm/1"] }

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "timed"
name = "timed"
run = "timed"
duration = nan

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "step"
name = "step"
  [cheat.values.f]
  type = "f32"
  step = nan
  default = 1.0

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "limit"
name = "limit"
  [cheat.values.f]
  type = "f32"
  max = nan
  default = 1.0

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "default"
name = "default"
  [cheat.values.f]
  type = "f32"
  default = nan

  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "insn-table"
name = "insn-table"

  [[cheat.patch]]
  at = { region = "heap", offset = 0x0 }
  expect = "08 00 80 52"
  encode = { insn = ["movz"], width = 32, rd = 8, value = 1 }
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.timed]
state = "refused"
reason = "invalid:duration"

[expect.cheat.step]
state = "refused"
reason = "invalid:values.f.step"

[expect.cheat.limit]
state = "refused"
reason = "invalid:values.f.max"

[expect.cheat.default]
state = "refused"
reason = "invalid:values.f.default"

[expect.cheat.insn-table]
state = "refused"
reason = "invalid:patch.encode.insn"
