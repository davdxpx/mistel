about = "Values the player sets: their rules, and their default written where a write names them."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[choices.items]
"1" = "Potion"
"2" = "Ether"

[[cheat]]
id = "count"
name = "count"
  [cheat.values.count]
  type = "u32"
  min = 0
  max = 9999999
  default = 999999
  step = 1000
  unit = "coins"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = "$count"

[[cheat]]
id = "flag"
name = "flag"
  [cheat.values.flag]
  type = "bool"
  default = true
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = "$flag"

[[cheat]]
id = "too-wide"
name = "too-wide"
  [cheat.values.n]
  type = "u32"
  default = 70000
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u16"
  value = "$n"

[[cheat]]
id = "above-max"
name = "above-max"
  [cheat.values.n]
  type = "u32"
  min = 0
  max = 10
  default = 11
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = "$n"

[[cheat]]
id = "unknown-ref"
name = "unknown-ref"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = "$nope"

[[cheat]]
id = "choice"
name = "choice"
  [cheat.values.item]
  type = "u16"
  choices = "items"
  default = 2
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u16"
  value = "$item"

[[cheat]]
id = "choice-default"
name = "choice-default"
  [cheat.values.item]
  type = "u16"
  choices = "items"
  default = 3
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u16"
  value = "$item"

[[cheat]]
id = "choice-list"
name = "choice-list"
  [cheat.values.item]
  type = "u16"
  choices = "weapons"
  default = 1
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u16"
  value = "$item"

[[cheat]]
id = "inline-choices"
name = "inline-choices"
  [cheat.values.speed]
  type = "u8"
  choices = { "1" = "Slow", "2" = "Fast" }
  default = 1
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = "$speed"

[[cheat]]
id = "flags"
name = "flags"
  [cheat.values.f]
  type = "u8"
  flags = { "0" = "First", "7" = "Last" }
  default = 0x81
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = "$f"

[[cheat]]
id = "flags-bit"
name = "flags-bit"
  [cheat.values.f]
  type = "u8"
  flags = { "8" = "Ninth" }
  default = 0
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = "$f"

[[cheat]]
id = "float-into-int"
name = "float-into-int"
  [cheat.values.speed]
  type = "f32"
  default = 1.5
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = "$speed"

[[cheat]]
id = "int-into-float"
name = "int-into-float"
  [cheat.values.speed]
  type = "u8"
  default = 3
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "f32"
  value = "$speed"

[[cheat]]
id = "bad-id"
name = "bad-id"
  [cheat.values.Count]
  type = "u32"
  default = 1
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = 1

[[cheat]]
id = "step-zero"
name = "step-zero"
  [cheat.values.n]
  type = "u32"
  default = 1
  step = 0
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = "$n"

[[cheat]]
id = "display-hex"
name = "display-hex"
  [cheat.values.n]
  type = "u32"
  default = 1
  display = "hex"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = "$n"

[[cheat]]
id = "display-oct"
name = "display-oct"
  [cheat.values.n]
  type = "u32"
  default = 1
  display = "oct"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = "$n"

[[cheat]]
id = "no-default"
name = "no-default"
  [cheat.values.n]
  type = "u32"
  min = 1
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = "$n"

[[cheat]]
id = "bool-range"
name = "bool-range"
  [cheat.values.b]
  type = "bool"
  default = false
  max = 1
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = "$b"
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.count]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", address = 0x10000000, bytes = "3F 42 0F 00" },
]

[expect.cheat.flag]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", bytes = "01" },
]

[expect.cheat.too-wide]
state = "refused"
reason = "value-out-of-range"

[expect.cheat.above-max]
state = "refused"
reason = "invalid:values.n.default"

[expect.cheat.unknown-ref]
state = "refused"
reason = "invalid:write.value"

[expect.cheat.choice]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", bytes = "02 00" },
]

[expect.cheat.choice-default]
state = "refused"
reason = "invalid:values.item.default"

[expect.cheat.choice-list]
state = "refused"
reason = "invalid:values.item.choices"

[expect.cheat.inline-choices]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", bytes = "01" },
]

[expect.cheat.flags]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", bytes = "81" },
]

[expect.cheat.flags-bit]
state = "refused"
reason = "invalid:values.f.flags"

[expect.cheat.float-into-int]
state = "refused"
reason = "invalid:write.value"

[expect.cheat.int-into-float]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", bytes = "00 00 40 40" },
]

[expect.cheat.bad-id]
state = "refused"
reason = "invalid:values.Count"

[expect.cheat.step-zero]
state = "refused"
reason = "invalid:values.n.step"

[expect.cheat.display-hex]
state = "off"
reason = ""
uses = "core"

[expect.cheat.display-oct]
state = "refused"
reason = "invalid:values.n.display"

[expect.cheat.no-default]
state = "refused"
reason = "invalid:values.n.default"

[expect.cheat.bool-range]
state = "refused"
reason = "invalid:values.b.max"
