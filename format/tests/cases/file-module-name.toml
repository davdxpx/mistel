about = "A build may only name modules of its platform."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { engine = "A1B2C3D4E5F60718" }

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[expect]
error = "schema:builds"
