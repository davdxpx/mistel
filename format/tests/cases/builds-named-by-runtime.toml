about = "A runtime that names the build itself, as a recompilation does, needs no module identities."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "per-build"
name = "per-build"
  [[cheat.write]]
  at = { region = "heap", offsets = { "1.0.2" = 0x10, "1.0.3" = 0x20 } }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"
build = "1.0.3"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = "1.0.3"

[expect.cheat.per-build]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", address = 0x10000020 },
]
