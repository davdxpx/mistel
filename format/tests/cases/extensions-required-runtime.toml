about = "A required extension the runtime does not support turns every cheat off."
text = '''
format = "mncf/1"
name = "Conformance"
extensions = { required = ["raw/1"] }

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"
extensions = ["arm64-imm/1"]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.plain]
state = "refused"
reason = "extension-missing:raw/1"
