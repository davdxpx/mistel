about = "`encode` belongs to arm64-imm/1: without the extension in the file's lists it is an unknown key."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "movz"
name = "movz"
  [[cheat.patch]]
  at = { module = "main", offset = 0x100 }
  expect = "08 00 80 52"
  encode = { insn = "movz", width = 32, rd = 8, value = 1 }

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [
  { at = 0x100, hex = "08 00 80 52 11 22 33 94" },
  { at = 0x200, hex = "08 00 80 52 08 00 A0 72" },
  { at = 0x300, hex = "00 10 2E 1E" },
]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = "1.0.2"

[expect.cheat.movz]
state = "refused"
reason = "unknown-key:patch.encode"

[expect.cheat.plain]
state = "off"
reason = ""
uses = "core"
