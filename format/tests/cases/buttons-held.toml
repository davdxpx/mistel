about = "With the buttons held, a hold cheat that is on works."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "hold"
name = "hold"
default = true
hold = "ZL"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "hold-two"
name = "hold-two"
default = true
hold = "ZL+R"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"
held = ["ZL"]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.hold]
state = "on"
reason = ""
uses = "core"

[expect.cheat.hold-two]
state = "waiting"
reason = ""
uses = "core"
