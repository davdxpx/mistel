about = "A build matches when every module it lists matches; the first such build in file order is taken."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds.with-update]
modules = { main = "A1B2C3D4E5F60718", subsdk0 = "0F0E0D0C0B0A0908" }

[builds.base]
modules = { main = "A1B2C3D4E5F60718" }

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [
  { at = 0x100, hex = "68 12 00 B9 11 22 33 94" },
]

[env.modules.subsdk0]
id = "0F0E0D0C0B0A0908"
base = 0x9000000
size = 0x100

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = "with-update"

[expect.cheat.plain]
state = "off"
reason = ""
uses = "core"
