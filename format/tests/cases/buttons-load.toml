about = """When the file is loaded, a cheat that is on and runs as an action waits for its first press. A cheat that \
uses its raw entry is on whatever buttons are held: its raw code tests them itself (sections 7.3, 10.1 and 11.2)."""
text = '''
format = "mncf/1"
name = "Conformance"
extensions = { optional = ["raw/1"] }

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[[cheat]]
id = "action"
name = "action"
default = true
run = "action"
press = "ZL"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "raw-hold"
name = "raw-hold"
default = true
hold = "ZL"
  [[cheat.raw]]
  syntax = "atmosphere"
  build = "1.0.2"
  code = "80000080 04000000 00001000 00000001 20000000"

[[cheat]]
id = "core-hold"
name = "core-hold"
default = true
hold = "ZL"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
  [[cheat.raw]]
  syntax = "atmosphere"
  build = "1.0.2"
  code = "80000080 04000000 00001000 00000001 20000000"
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = "1.0.2"

[expect.cheat.action]
state = "waiting"
reason = ""
uses = "core"

[expect.cheat.raw-hold]
state = "on"
reason = ""
uses = "raw"

[expect.cheat.core-hold]
state = "waiting"
reason = ""
uses = "core"
