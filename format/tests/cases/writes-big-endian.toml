about = "A big-endian platform with 4-byte pointers and absolute addresses (n64)."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "n64"
id = "NABE"

[[cheat]]
id = "words"
name = "words"
  [[cheat.write]]
  at = { address = 0x80100000 }
  type = "u32"
  value = 0x11223344

  [[cheat.write]]
  at = { address = 0x80100004 }
  type = "u16"
  value = 0xABCD

  [[cheat.write]]
  at = { address = 0x80100008 }
  type = "f32"
  value = 1.5

  [[cheat.write]]
  at = { address = 0x80100010, path = [4] }
  type = "u8"
  value = 1

[[cheat]]
id = "outside"
name = "outside"
  [[cheat.write]]
  at = { address = 0x80200000 }
  type = "u8"
  value = 1

[[cheat]]
id = "override"
name = "override"
  [[cheat.override]]
  function = { address = 0x80100020 }
  action = "skip"
  expect = "27 BD FF E8"
'''

[env]
platform = "n64"
capabilities = ["guest-read", "guest-write", "code-bytes", "buttons", "display"]

[[env.memory]]
at = 0x80100000
size = 0x100

[[env.memory]]
at = 0x80100010
hex = "80 10 00 40"

[expect]
build = ""

[expect.cheat.words]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", address = 0x80100000, bytes = "11 22 33 44" },
  { kind = "write", address = 0x80100004, bytes = "AB CD" },
  { kind = "write", address = 0x80100008, bytes = "3F C0 00 00" },
  { kind = "write", address = 0x80100044, bytes = "01" },
]

[expect.cheat.outside]
state = "refused"
reason = "outside"

[expect.cheat.override]
state = "refused"
reason = "capability-missing:code-hook"
