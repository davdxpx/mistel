about = "Every write type, stored in the platform's byte order, and the values that do not fit."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
modules = { main = "1122334455667788" }

[[cheat]]
id = "all-types"
name = "all-types"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 255
  [[cheat.write]]
  at = { region = "heap", offset = 0x1 }
  type = "s8"
  value = -1
  [[cheat.write]]
  at = { region = "heap", offset = 0x2 }
  type = "u16"
  value = 0x1234
  [[cheat.write]]
  at = { region = "heap", offset = 0x4 }
  type = "s16"
  value = -2
  [[cheat.write]]
  at = { region = "heap", offset = 0x8 }
  type = "u32"
  value = 999999
  [[cheat.write]]
  at = { region = "heap", offset = 0xC }
  type = "s32"
  value = -100
  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u64"
  value = "0xFFFFFFFF80000000"
  [[cheat.write]]
  at = { region = "heap", offset = 0x18 }
  type = "s64"
  value = -1
  [[cheat.write]]
  at = { region = "heap", offset = 0x20 }
  type = "f32"
  value = 1.5
  [[cheat.write]]
  at = { region = "heap", offset = 0x24 }
  type = "f32"
  value = 2
  [[cheat.write]]
  at = { region = "heap", offset = 0x28 }
  type = "f64"
  value = 0.1
  [[cheat.write]]
  at = { region = "heap", offset = 0x30 }
  type = "bytes"
  value = "01 02 03"
  [[cheat.write]]
  at = { region = "heap", offset = 0x34 }
  type = "u32"
  value = 6
  expect = 5
  [[cheat.write]]
  at = { region = "heap", offset = 0x38 }
  type = "f32"
  value = inf

[[cheat]]
id = "u8-too-big"
name = "u8-too-big"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 256

[[cheat]]
id = "s8-too-small"
name = "s8-too-small"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "s8"
  value = -129

[[cheat]]
id = "int-from-float"
name = "int-from-float"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u16"
  value = 1.5

[[cheat]]
id = "f32-too-big"
name = "f32-too-big"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "f32"
  value = 1e39

[[cheat]]
id = "bad-type"
name = "bad-type"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u24"
  value = 1

[[cheat]]
id = "bytes-not-bytes"
name = "bytes-not-bytes"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "bytes"
  value = 5

[[cheat]]
id = "expect-wrong"
name = "expect-wrong"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
  expect = "x"

[[cheat]]
id = "bytes-expect-length"
name = "bytes-expect-length"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "bytes"
  value = "01 02"
  expect = "01"

[[cheat]]
id = "no-value"
name = "no-value"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""

[expect.cheat.all-types]
state = "off"
reason = ""
uses = "core"
ops = [
  { kind = "write", address = 0x10000000, type = "u8", bytes = "FF" },
  { kind = "write", address = 0x10000001, type = "s8", bytes = "FF" },
  { kind = "write", address = 0x10000002, type = "u16", bytes = "34 12" },
  { kind = "write", address = 0x10000004, type = "s16", bytes = "FE FF" },
  { kind = "write", address = 0x10000008, type = "u32", bytes = "3F 42 0F 00" },
  { kind = "write", address = 0x1000000C, type = "s32", bytes = "9C FF FF FF" },
  { kind = "write", address = 0x10000010, type = "u64", bytes = "00 00 00 80 FF FF FF FF" },
  { kind = "write", address = 0x10000018, type = "s64", bytes = "FF FF FF FF FF FF FF FF" },
  { kind = "write", address = 0x10000020, type = "f32", bytes = "00 00 C0 3F" },
  { kind = "write", address = 0x10000024, type = "f32", bytes = "00 00 00 40" },
  { kind = "write", address = 0x10000028, type = "f64", bytes = "9A 99 99 99 99 99 B9 3F" },
  { kind = "write", address = 0x10000030, type = "bytes", bytes = "01 02 03" },
  { kind = "write", address = 0x10000034, type = "u32", bytes = "06 00 00 00", expect = "05 00 00 00" },
  { kind = "write", address = 0x10000038, type = "f32", bytes = "00 00 80 7F" },
]

[expect.cheat.u8-too-big]
state = "refused"
reason = "invalid:write.value"

[expect.cheat.s8-too-small]
state = "refused"
reason = "invalid:write.value"

[expect.cheat.int-from-float]
state = "refused"
reason = "invalid:write.value"

[expect.cheat.f32-too-big]
state = "refused"
reason = "invalid:write.value"

[expect.cheat.bad-type]
state = "refused"
reason = "invalid:write.type"

[expect.cheat.bytes-not-bytes]
state = "refused"
reason = "invalid:write.value"

[expect.cheat.expect-wrong]
state = "refused"
reason = "invalid:write.expect"

[expect.cheat.bytes-expect-length]
state = "refused"
reason = "invalid:write.expect"

[expect.cheat.no-value]
state = "refused"
reason = "invalid:write.value"
