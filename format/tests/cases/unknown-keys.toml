about = "A key in a cheat that neither the core nor a listed extension defines turns that cheat off; unknown keys are found before broken values."
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[builds."1.0.3"]
date = "soon"
modules = { main = "1122334455667788" }

[[cheat]]
id = "top"
name = "top"
colour = "red"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "in-location"
name = "in-location"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0, colour = "red" }
  type = "u32"
  value = 1

[[cheat]]
id = "in-value"
name = "in-value"
  [cheat.values.count]
  type = "u32"
  default = 1
  colour = "red"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u32"
  value = "$count"

[[cheat]]
id = "in-write"
name = "in-write"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
  size = 1

[[cheat]]
id = "raw-not-listed"
name = "raw-not-listed"
  [[cheat.raw]]
  syntax = "atmosphere"
  build = "1.0.2"
  code = "04000000 00100000 00000001"

[[cheat]]
id = "both"
name = 5
colour = "red"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1

[[cheat]]
id = "plain"
name = "plain"
  [[cheat.write]]
  at = { region = "heap", offset = 0x0 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
build = ""
warnings = ["unknown-key:builds.1.0.3.date"]

[expect.cheat.top]
state = "refused"
reason = "unknown-key:colour"

[expect.cheat.in-location]
state = "refused"
reason = "unknown-key:write.at.colour"

[expect.cheat.in-value]
state = "refused"
reason = "unknown-key:values.count.colour"

[expect.cheat.in-write]
state = "refused"
reason = "unknown-key:write.size"

[expect.cheat.raw-not-listed]
state = "refused"
reason = "unknown-key:raw"

[expect.cheat.both]
state = "refused"
reason = "unknown-key:colour"

[expect.cheat.plain]
state = "off"
reason = ""
uses = "core"
