about = """The marks follow the ids too: a cheat added and then renamed is new under its new id, a fixed cheat that \
was removed later is not marked, and a cheat that is new and fixed is marked new only."""
installed_text = '''
format = "mncf/1"
name = "Marks"
id = "example.org/someone/marks"
file_version = "1"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "y"
name = "Y"

  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 1
'''
new_text = '''
format = "mncf/1"
name = "Marks"
id = "example.org/someone/marks"
file_version = "3"

[[changes]]
version = "3"
renamed = { x = "x2" }
removed = ["y"]
added = ["w"]
fixed = ["z", "x2"]

[[changes]]
version = "2"
added = ["x", "z"]
fixed = ["y"]

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "z"
name = "Z"

  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 1

[[cheat]]
id = "x2"
name = "X"

  [[cheat.write]]
  at = { region = "heap", offset = 0x20 }
  type = "u8"
  value = 1

[[cheat]]
id = "w"
name = "W"

  [[cheat.write]]
  at = { region = "heap", offset = 0x30 }
  type = "u8"
  value = 1
'''

[expect]
since = ["3", "2"]
new = ["z", "x2", "w"]
fixed = []
