about = """`run = "once"`: the writes happen in the first pass in which the cheat can work after it is switched on, \
then it switches itself off and shows as done (`off`, reason `done`). Switching it on again runs it again. With a \
condition, it waits until the condition holds (sections 7.2 and 11.5)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "give"
name = "give"
default = true
run = "once"
  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  value = 99

[[cheat]]
id = "heal"
name = "heal"
run = "once"
  [[cheat.when]]
  at = { region = "heap", offset = 0x20 }
  type = "u8"
  op = "<"
  value = 5
  [[cheat.write]]
  at = { region = "heap", offset = 0x20 }
  type = "u8"
  value = 50
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[[env.memory]]
at = 0x10000020
hex = "0A"

[expect]
cheat.give = { state = "on", reason = "" }

[[step]]
  [step.expect]
  changes = [ { kind = "write", cheat = "give", address = 0x10000010, bytes = "63 00" } ]
  cheat.give = { state = "off", reason = "done" }

[[step]]
  [step.expect]
  cheat.give = { state = "off", reason = "done" }

[[step]]
on = ["give"]
  [step.expect]
  changes = [ { kind = "write", cheat = "give", address = 0x10000010, bytes = "63 00" } ]
  cheat.give = { state = "off", reason = "done" }

[[step]]
on = ["heal"]
  [step.expect]
  cheat.heal = { state = "on", reason = "" }

[[step]]
memory = [ { at = 0x10000020, hex = "03" } ]
  [step.expect]
  changes = [ { kind = "write", cheat = "heal", address = 0x10000020, bytes = "32" } ]
  cheat.heal = { state = "off", reason = "done" }
