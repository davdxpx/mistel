about = """An override that the runtime applies by writing a stub works as a patch does: the stub is written when the \
cheat is switched on, again when a player value in it changes, and the function's first bytes come back when it is \
switched off (sections 7.5, 11.3 and 11.5)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "ret"
name = "ret"
  [cheat.values.v]
  type = "u16"
  default = 1
  [[cheat.override]]
  function = { module = "main", offset = 0x400 }
  action = "return"
  value = "$v"
  expect = "FD 7B BF A9 FD 03 00 91"

[[cheat]]
id = "skip"
name = "skip"
  [[cheat.override]]
  function = { module = "main", offset = 0x500 }
  action = "skip"
  expect = "FD 7B BF A9"
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [
  { at = 0x400, hex = "FD 7B BF A9 FD 03 00 91" },
  { at = 0x500, hex = "FD 7B BF A9" },
]

[[step]]
on = ["ret", "skip"]
  [step.expect]
  changes = [
    { kind = "patch", address = 0x8000400, bytes = "20 00 80 D2 C0 03 5F D6" },
    { kind = "patch", address = 0x8000500, bytes = "C0 03 5F D6" },
  ]

[[step]]
values = { "ret.v" = 2 }
  [step.expect]
  changes = [ { kind = "patch", address = 0x8000400, bytes = "40 00 80 D2 C0 03 5F D6" } ]

[[step]]
off = ["ret", "skip"]
  [step.expect]
  changes = [
    { kind = "restore", address = 0x8000400, bytes = "FD 7B BF A9 FD 03 00 91" },
    { kind = "restore", address = 0x8000500, bytes = "FD 7B BF A9" },
  ]
