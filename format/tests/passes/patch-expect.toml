about = """Before a patch is written, the bytes at its place are compared with `expect` as they are then, not as the \
module file had them. A place that holds the patch's bytes already counts as patched: nothing is written, and \
`expect` is what comes back when the cheat is switched off. A place that holds anything else refuses the cheat, \
and the cheats that require it (sections 7.4, 7.8 and 11.5)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "done-before"
name = "done-before"
  [[cheat.patch]]
  at = { module = "main", offset = 0x100 }
  expect = "68 12 00 B9"
  bytes = "69 12 00 B9"

[[cheat]]
id = "changed"
name = "changed"
  [[cheat.patch]]
  at = { module = "main", offset = 0x200 }
  expect = "00 10 2E 1E"
  bytes = "00 10 20 1E"

[[cheat]]
id = "user"
name = "user"
requires = ["changed"]
  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [
  { at = 0x100, hex = "68 12 00 B9" },
  { at = 0x200, hex = "00 10 2E 1E" },
]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[[env.memory]]
at = 0x8000100
hex = "69 12 00 B9"

[[step]]
about = "The code in memory holds the patch already."
on = ["done-before"]
  [step.expect]
  cheat.done-before = { state = "on", reason = "" }

[[step]]
off = ["done-before"]
  [step.expect]
  changes = [ { kind = "restore", address = 0x8000100, bytes = "68 12 00 B9" } ]

[[step]]
about = "Something else changed the code at the second place after the file was loaded."
memory = [ { at = 0x8000200, hex = "11 22 33 44" } ]
on = ["user"]
  [step.expect]
  cheat.changed = { state = "refused", reason = "expect-mismatch" }
  cheat.user = { state = "refused", reason = "requires:changed" }

[[step]]
about = "A refused cheat cannot be switched on again."
on = ["user", "changed"]
  [step.expect]
  cheat.changed = { state = "refused", reason = "expect-mismatch" }
  cheat.user = { state = "refused", reason = "requires:changed" }
