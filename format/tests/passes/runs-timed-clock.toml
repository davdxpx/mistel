about = """`run = "timed"` with the time the runtime gives each pass, in seconds: the cheat stops in the first pass at \
least `duration` seconds after its first pass (sections 7.2 and 11.5)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "t"
name = "t"
default = true
run = "timed"
duration = 0.5
  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[[step]]
now = 10.0
  [step.expect]
  changes = [ { kind = "write", cheat = "t", address = 0x10000010, bytes = "01" } ]

[[step]]
now = 10.2
  [step.expect]
  changes = [ { kind = "write", cheat = "t", address = 0x10000010, bytes = "01" } ]

[[step]]
now = 10.49
  [step.expect]
  changes = [ { kind = "write", cheat = "t", address = 0x10000010, bytes = "01" } ]
  cheat.t = { state = "on", reason = "" }

[[step]]
now = 10.5
  [step.expect]
  cheat.t = { state = "off", reason = "done" }
