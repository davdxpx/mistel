about = """With `trigger = "enter"`, a cheat writes once each time its conditions start to hold: in a pass in which \
they hold and did not hold at its test before. Before its first test they count as not holding. A patch still \
follows the conditions: applied while they hold. `match = "any"` needs one condition to hold (section 7.9)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "e"
name = "e"
default = true
trigger = "enter"
  [[cheat.when]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  op = "=="
  value = 1
  [[cheat.write]]
  at = { region = "heap", offset = 0x20 }
  type = "u8"
  value = 9
  [[cheat.patch]]
  at = { module = "main", offset = 0x200 }
  expect = "00 10 2E 1E"
  bytes = "00 10 20 1E"

[[cheat]]
id = "any"
name = "any"
default = true
match = "any"
  [[cheat.when]]
  at = { region = "heap", offset = 0x11 }
  type = "u8"
  op = "=="
  value = 1
  [[cheat.when]]
  at = { region = "heap", offset = 0x12 }
  type = "u8"
  op = "=="
  value = 1
  [[cheat.write]]
  at = { region = "heap", offset = 0x21 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [ { at = 0x200, hex = "00 10 2E 1E" } ]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[[env.memory]]
at = 0x10000010
hex = "01"

[[step]]
about = "The condition holds at the first test."
  [step.expect]
  changes = [
    { kind = "patch", address = 0x8000200, bytes = "00 10 20 1E" },
    { kind = "write", cheat = "e", address = 0x10000020, bytes = "09" },
  ]

[[step]]
about = "Still holding: no write, and the patch stays."

[[step]]
memory = [ { at = 0x10000010, hex = "00" }, { at = 0x10000012, hex = "01" } ]
  [step.expect]
  changes = [
    { kind = "restore", address = 0x8000200, bytes = "00 10 2E 1E" },
    { kind = "write", cheat = "any", address = 0x10000021, bytes = "01" },
  ]

[[step]]
memory = [ { at = 0x10000010, hex = "01" }, { at = 0x10000012, hex = "00" } ]
  [step.expect]
  changes = [
    { kind = "patch", address = 0x8000200, bytes = "00 10 20 1E" },
    { kind = "write", cheat = "e", address = 0x10000020, bytes = "09" },
  ]
