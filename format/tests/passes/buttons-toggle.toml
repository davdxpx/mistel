about = """A `toggle` combination is pressed in a pass in which all of its buttons are held and were not all held in the \
pass before, or when the runtime says they were pressed together since the last pass. A press switches the cheat on \
or off, and it works in that pass. A combination is pressed together with a larger one that holds it (sections 7.3 \
and 11.5)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "t"
name = "t"
toggle = "L+DUP"
  [[cheat.patch]]
  at = { module = "main", offset = 0x200 }
  expect = "00 10 2E 1E"
  bytes = "00 10 20 1E"

[[cheat]]
id = "u"
name = "u"
toggle = "DUP"
  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 7
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [ { at = 0x200, hex = "00 10 2E 1E" } ]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[[step]]
held = ["L"]
  [step.expect]
  cheat.t = { state = "off", reason = "" }

[[step]]
held = ["L", "DUP"]
  [step.expect]
  changes = [
    { kind = "patch", address = 0x8000200, bytes = "00 10 20 1E" },
    { kind = "write", cheat = "u", address = 0x10000010, bytes = "07" },
  ]
  cheat.t = { state = "on", reason = "" }
  cheat.u = { state = "on", reason = "" }

[[step]]
about = "Still held: no new press."
  [step.expect]
  changes = [ { kind = "write", cheat = "u", address = 0x10000010, bytes = "07" } ]

[[step]]
held = ["L"]
  [step.expect]
  changes = [ { kind = "write", cheat = "u", address = 0x10000010, bytes = "07" } ]

[[step]]
held = ["L", "DUP"]
  [step.expect]
  changes = [ { kind = "restore", address = 0x8000200, bytes = "00 10 2E 1E" } ]
  cheat.t = { state = "off", reason = "" }
  cheat.u = { state = "off", reason = "" }

[[step]]
about = "A press shorter than a pass, which the runtime reports."
held = []
press = ["DUP+L"]
  [step.expect]
  changes = [
    { kind = "patch", address = 0x8000200, bytes = "00 10 20 1E" },
    { kind = "write", cheat = "u", address = 0x10000010, bytes = "07" },
  ]
  cheat.t = { state = "on", reason = "" }
  cheat.u = { state = "on", reason = "" }
