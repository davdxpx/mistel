about = """A cheat that uses its raw entry runs it in every pass while it is on: each pass has a `raw` change for it, \
among the writes in file order. Its raw code tests buttons and memory itself, so `hold` does not hold it back. One \
that runs once runs its raw entry in one pass (sections 10.1 and 11.5)."""
text = '''
format = "mncf/1"
name = "Conformance"
extensions = { optional = ["raw/1"] }

[game]
platform = "switch"
id = "0100000000ABC000"

[builds."1.0.2"]
modules = { main = "A1B2C3D4E5F60718" }

[[cheat]]
id = "r"
name = "r"
default = true
hold = "ZL"
  [[cheat.raw]]
  syntax = "atmosphere"
  build = "1.0.2"
  code = "80000080 04000000 00001000 00000001 20000000"

[[cheat]]
id = "w"
name = "w"
default = true
  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 1

[[cheat]]
id = "ro"
name = "ro"
run = "once"
  [[cheat.raw]]
  syntax = "atmosphere"
  build = "1.0.2"
  code = "04000000 00001004 00000002"
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
cheat.r = { state = "on", reason = "" }

[[step]]
  [step.expect]
  changes = [
    { kind = "raw", cheat = "r", syntax = "atmosphere", build = "1.0.2", code = "80000080 04000000 00001000 00000001 20000000" },
    { kind = "write", cheat = "w", address = 0x10000010, bytes = "01" },
  ]
  cheat.r = { state = "on", reason = "" }

[[step]]
on = ["ro"]
  [step.expect]
  changes = [
    { kind = "raw", cheat = "r" },
    { kind = "write", cheat = "w" },
    { kind = "raw", cheat = "ro", syntax = "atmosphere", build = "1.0.2", code = "04000000 00001004 00000002" },
  ]
  cheat.ro = { state = "off", reason = "done" }

[[step]]
off = ["r"]
  [step.expect]
  changes = [ { kind = "write", cheat = "w" } ]
