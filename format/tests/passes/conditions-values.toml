about = """What conditions compare: another place, a player value that the player changes between passes, a range, \
bits, a float and a signed type. Numbers compare by their value, whatever their types (section 7.9)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "cmp"
name = "cmp"
default = true
  [[cheat.when]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  op = "<"
  value = { at = { region = "heap", offset = 0x12 }, type = "u16" }
  [[cheat.write]]
  at = { region = "heap", offset = 0x20 }
  type = "u8"
  value = 1

[[cheat]]
id = "lim"
name = "lim"
default = true
  [cheat.values.limit]
  type = "u16"
  default = 30
  [[cheat.when]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  op = "<="
  value = "$limit"
  [[cheat.write]]
  at = { region = "heap", offset = 0x21 }
  type = "u8"
  value = 1

[[cheat]]
id = "btw"
name = "btw"
default = true
  [[cheat.when]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  op = "between"
  value = [1, 5]
  [[cheat.write]]
  at = { region = "heap", offset = 0x22 }
  type = "u8"
  value = 1

[[cheat]]
id = "bit"
name = "bit"
default = true
  [[cheat.when]]
  at = { region = "heap", offset = 0x14 }
  type = "u8"
  op = "&"
  value = 4
  [[cheat.write]]
  at = { region = "heap", offset = 0x23 }
  type = "u8"
  value = 1

[[cheat]]
id = "nbit"
name = "nbit"
default = true
  [[cheat.when]]
  at = { region = "heap", offset = 0x14 }
  type = "u8"
  op = "!&"
  value = 4
  [[cheat.write]]
  at = { region = "heap", offset = 0x24 }
  type = "u8"
  value = 1

[[cheat]]
id = "flt"
name = "flt"
default = true
  [[cheat.when]]
  at = { region = "heap", offset = 0x18 }
  type = "f32"
  op = ">"
  value = 1.5
  [[cheat.write]]
  at = { region = "heap", offset = 0x25 }
  type = "u8"
  value = 1

[[cheat]]
id = "neg"
name = "neg"
default = true
  [[cheat.when]]
  at = { region = "heap", offset = 0x1C }
  type = "s16"
  op = "<"
  value = 0
  [[cheat.write]]
  at = { region = "heap", offset = 0x26 }
  type = "u8"
  value = 1

[[cheat]]
id = "mixed"
name = "mixed"
default = true
  [[cheat.when]]
  at = { region = "heap", offset = 0x18 }
  type = "f32"
  op = ">="
  value = { at = { region = "heap", offset = 0x1C }, type = "s16" }
  [[cheat.write]]
  at = { region = "heap", offset = 0x27 }
  type = "u8"
  value = 1
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[[env.memory]]
at = 0x10000010
hex = "03 00 02 00 06 00 00 00 00 00 00 40 FF FF"

[[step]]
  [step.expect]
  changes = [
    { kind = "write", cheat = "lim", address = 0x10000021, bytes = "01" },
    { kind = "write", cheat = "btw", address = 0x10000022, bytes = "01" },
    { kind = "write", cheat = "bit", address = 0x10000023, bytes = "01" },
    { kind = "write", cheat = "flt", address = 0x10000025, bytes = "01" },
    { kind = "write", cheat = "neg", address = 0x10000026, bytes = "01" },
    { kind = "write", cheat = "mixed", address = 0x10000027, bytes = "01" },
  ]

[[step]]
values = { "lim.limit" = 2 }
memory = [
  { at = 0x10000012, hex = "09 00 02" },
  { at = 0x10000018, hex = "00 00 80 3F 02 00" },
]
  [step.expect]
  changes = [
    { kind = "write", cheat = "cmp", address = 0x10000020, bytes = "01" },
    { kind = "write", cheat = "btw", address = 0x10000022, bytes = "01" },
    { kind = "write", cheat = "nbit", address = 0x10000024, bytes = "01" },
  ]
