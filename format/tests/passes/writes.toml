about = """A write repeats in every pass in which its cheat works, as bytes in the platform's byte order. A write \
with `expect` happens only in passes in which its place holds that value (sections 7.4 and 11.5)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "w"
name = "w"
default = true
  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 9
  expect = 3
  [[cheat.write]]
  at = { region = "heap", offset = 0x20 }
  type = "f32"
  value = -2.5
  [[cheat.write]]
  at = { region = "heap", offset = 0x30 }
  type = "bytes"
  value = "DE AD BE EF"
  expect = "00 00 00 00"
'''

[env]
platform = "switch"

[env.regions.heap]
base = 0x10000000
size = 0x10000

[[env.memory]]
at = 0x10000010
hex = "03"

[[step]]
  [step.expect]
  changes = [
    { kind = "write", cheat = "w", address = 0x10000010, bytes = "09" },
    { kind = "write", cheat = "w", address = 0x10000020, bytes = "00 00 20 C0" },
    { kind = "write", cheat = "w", address = 0x10000030, bytes = "DE AD BE EF" },
  ]

[[step]]
about = "Both places hold the written values now, not their expect."
  [step.expect]
  changes = [ { kind = "write", cheat = "w", address = 0x10000020, bytes = "00 00 20 C0" } ]

[[step]]
memory = [ { at = 0x10000010, hex = "03" } ]
  [step.expect]
  changes = [
    { kind = "write", cheat = "w", address = 0x10000010, bytes = "09" },
    { kind = "write", cheat = "w", address = 0x10000020, bytes = "00 00 20 C0" },
  ]
