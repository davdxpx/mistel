about = """With `trigger = "while"`, a cheat writes in every pass in which its conditions hold. Its patch is applied \
while they hold and restored when they stop holding; code changes only in a pass in which the result flips. Places \
are read as they are at the start of the pass, before its changes are made (sections 7.9 and 11.5)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "heal"
name = "heal"
default = true
  [[cheat.when]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  op = "<"
  value = 10
  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u16"
  value = 100

[[cheat]]
id = "freeze"
name = "freeze"
default = true
  [[cheat.when]]
  at = { region = "heap", offset = 0x30 }
  type = "u8"
  op = "=="
  value = 1
  [[cheat.patch]]
  at = { module = "main", offset = 0x200 }
  expect = "00 10 2E 1E"
  bytes = "00 10 20 1E"
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [ { at = 0x200, hex = "00 10 2E 1E" } ]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[[env.memory]]
at = 0x10000010
hex = "32 00"

[[step]]
  [step.expect]
  cheat.heal = { state = "on", reason = "" }
  cheat.freeze = { state = "on", reason = "" }

[[step]]
memory = [ { at = 0x10000010, hex = "05 00" } ]
  [step.expect]
  changes = [ { kind = "write", cheat = "heal", address = 0x10000010, bytes = "64 00" } ]

[[step]]
about = "The write of the pass before made the condition false."

[[step]]
memory = [ { at = 0x10000030, hex = "01" } ]
  [step.expect]
  changes = [ { kind = "patch", address = 0x8000200, bytes = "00 10 20 1E" } ]

[[step]]
about = "The condition still holds: no change."

[[step]]
memory = [ { at = 0x10000030, hex = "00" } ]
  [step.expect]
  changes = [ { kind = "restore", address = 0x8000200, bytes = "00 10 2E 1E" } ]
  cheat.freeze = { state = "on", reason = "" }
