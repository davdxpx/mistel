about = """A cheat with `hold` works only in passes in which all of its buttons are held: its patch is applied then and \
restored when they are let go, and its writes happen in each such pass (sections 7.3 and 11.5)."""
text = '''
format = "mncf/1"
name = "Conformance"

[game]
platform = "switch"
id = "0100000000ABC000"

[[cheat]]
id = "boost"
name = "boost"
default = true
hold = "ZL"
  [[cheat.patch]]
  at = { module = "main", offset = 0x200 }
  expect = "00 10 2E 1E"
  bytes = "00 10 20 1E"
  [[cheat.write]]
  at = { region = "heap", offset = 0x10 }
  type = "u8"
  value = 1

[[cheat]]
id = "both"
name = "both"
default = true
hold = "ZL+R"
  [[cheat.write]]
  at = { region = "heap", offset = 0x11 }
  type = "u8"
  value = 2
'''

[env]
platform = "switch"

[env.modules.main]
id = "A1B2C3D4E5F60718"
base = 0x8000000
size = 0x3000
code = [0x0, 0x1000]
rodata = [0x1000, 0x2000]
data = [0x2000, 0x3000]
bytes = [ { at = 0x200, hex = "00 10 2E 1E" } ]

[env.regions.heap]
base = 0x10000000
size = 0x10000

[expect]
cheat.boost = { state = "waiting", reason = "" }
cheat.both = { state = "waiting", reason = "" }

[[step]]
  [step.expect]
  cheat.boost = { state = "waiting", reason = "" }

[[step]]
held = ["ZL"]
  [step.expect]
  changes = [
    { kind = "patch", address = 0x8000200, bytes = "00 10 20 1E" },
    { kind = "write", cheat = "boost", address = 0x10000010, bytes = "01" },
  ]
  cheat.boost = { state = "on", reason = "" }
  cheat.both = { state = "waiting", reason = "" }

[[step]]
held = ["ZL", "R"]
  [step.expect]
  changes = [
    { kind = "write", cheat = "boost", address = 0x10000010, bytes = "01" },
    { kind = "write", cheat = "both", address = 0x10000011, bytes = "02" },
  ]
  cheat.both = { state = "on", reason = "" }

[[step]]
held = []
  [step.expect]
  changes = [ { kind = "restore", address = 0x8000200, bytes = "00 10 2E 1E" } ]
  cheat.boost = { state = "waiting", reason = "" }
  cheat.both = { state = "waiting", reason = "" }
