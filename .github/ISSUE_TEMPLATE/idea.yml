name: Idea or question
description: A feature, a change to the cheat format, an engine to support, or a question
labels: [idea]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What is this?
      options:
        - An idea for a feature
        - A change to the .mncf format
        - An engine or a game to support
        - A question
    validations:
      required: true
  - type: textarea
    id: post
    attributes:
      label: Your post
      description: For a feature or a format change, say what it is for and who it helps.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: My post has no game files, keys, firmware or links to them, and doesn't ask for any.
          required: true
