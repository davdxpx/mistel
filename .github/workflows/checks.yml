name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Attribution, private data, binaries, text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check-publish
        run: sh scripts/check-publish.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  python-reader:
    name: Python reader and conformance suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests and conformance suite
        run: python -m unittest discover -s format/lib/python/tests -v

  java-reader:
    name: Java reader and conformance suite (Android API 33)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 33 and d8
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -f "$sdk/platforms/android-33/android.jar" ]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" > /dev/null
          fi
          echo "ANDROID_JAR=$sdk/platforms/android-33/android.jar" >> "$GITHUB_ENV"
          echo "D8=$(ls -d "$sdk"/build-tools/*/ | sort -V | tail -n 1)d8" >> "$GITHUB_ENV"
      - name: Build, unit tests and conformance suite
        run: sh format/lib/java/build.sh

  c-reader:
    name: C library, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            os: ubuntu-latest
            cc: gcc
          - name: Clang
            os: ubuntu-latest
            cc: clang
          - name: GCC, AddressSanitizer and UndefinedBehaviorSanitizer
            os: ubuntu-latest
            cc: gcc
            sanitize: address,undefined
          - name: Clang, AddressSanitizer and UndefinedBehaviorSanitizer, amalgamation
            os: ubuntu-latest
            cc: clang
            sanitize: address,undefined
            amalgamation: 'ON'
          - name: MSVC
            os: windows-latest
          - name: MSVC, amalgamation
            os: windows-latest
            amalgamation: 'ON'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then export CC="${{ matrix.cc }}"; fi
          cmake -S format/lib/c -B build -DCMAKE_BUILD_TYPE=Debug -DMNCF_WERROR=ON \
            -DMNCF_SANITIZE="${{ matrix.sanitize }}" -DMNCF_AMALGAMATION=${{ matrix.amalgamation || 'OFF' }}
      - name: Build
        run: cmake --build build --config Debug
      - name: Unit tests and conformance suite
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: The dump, byte for byte as Python's
        shell: bash
        run: |
          runner=build/mncf_conformance
          if [ ! -f "$runner" ]; then runner=build/Debug/mncf_conformance.exe; fi
          python format/lib/c/tests/compare_dump.py "$runner"

  c-reader-android:
    name: C library for Android (NDK, arm64-v8a, API 33)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the NDK
        run: |
          cmake -S format/lib/c -B build -DCMAKE_BUILD_TYPE=Release -DMNCF_WERROR=ON \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-33
          cmake --build build
          file build/libmncf.a build/mncf_conformance build/mncf_unit

  tools:
    name: mistel tools
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests without the optional packages
        run: python -m unittest discover -s tools/tests -v
      - name: Tests with Capstone and lz4
        run: |
          python -m pip install capstone lz4
          python -m unittest discover -s tools/tests -v
          python -m unittest discover -s format/lib/python/tests -v
